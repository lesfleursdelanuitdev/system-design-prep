id: u10-adr-push-or-pull
type: write
title: "Write ADR-001: push, pull, or both?"
prompt: |
  Shelf keeps a cached copy of each app’s items: title, link, scope, and whether each one still exists. It has to find out when an app’s items change. There are two basic ways:

  - **Push:** each app calls Shelf when one of its items changes.
  - **Pull:** Shelf asks each app for its full list of items on a schedule.

  Write ADR-001 for this decision. Use what you know about Shelf: the apps are built by other teams and will sometimes fail to send a change; asking them for more than one list endpoint is expensive; one developer runs Shelf; a pushed change should show in lookups within 5 s; and priority one is never to lose or wrongly remove a tag.

  Compare at least three options, choose one, and be honest about what your choice costs.

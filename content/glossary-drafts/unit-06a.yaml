# New terms for Unit 6, lessons 1–5 (contracts). Merged into the glossary by the content loader.
- id: event
  term: Event
  short: A message one part of a system sends to say that something has happened, such as “item trashed”, for any part that cares to act on it. Its shape is a contract too.
  see: [contract, asyncapi]
- id: opaque-value
  term: Opaque value
  short: A value the caller must keep and send back exactly as it got it, without taking it apart, building one itself or reading meaning into it. Cursors and Shelf’s tag ids are opaque.
  aka: [opaque]
  see: [cursor, key]
- id: operation
  term: Operation
  short: One thing a caller can ask a provider to do, such as putting a tag on an item, with its own inputs, outputs, preconditions, postconditions and errors.
  see: [endpoint, precondition, postcondition]

# New terms for Unit 8 (when things go wrong). Merged into the glossary by the content loader.
- id: error-budget
  term: Error budget
  short: The room for failure an SLO leaves. At 99.9% a month, 0.1% of requests may fail or be slow, about 43 minutes. With budget left you can take risks; when it runs low, you slow down.
  see: [slo, sli]
